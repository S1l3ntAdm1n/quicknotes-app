<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QuickNotes - Note taking web app adapted from Day 4 with categories, instant search, and local persistence.">
  <title>QuickNotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="header-inner">
        <div class="branding">
          <div class="logo-mark" aria-hidden="true">&#9997;&#65039;</div>
          <div class="brand-text">
            <h1>QuickNotes</h1>
            <p class="tagline">Capture your thoughts quickly and stay organized</p>
          </div>
        </div>
        <nav class="nav-bar">
          <button id="theme-toggle" type="button" aria-label="Toggle dark/light mode">Dark mode</button>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <!-- Section 1: Add a note -->
      <section class="card section-add-note">
        <h2>Add a note</h2>
        <form id="note-form" class="note-form" novalidate>
          <div class="form-group form-group-text">
            <label for="note-input">Note text</label>
            <input 
              type="text" 
              id="note-input" 
              name="note-input" 
              placeholder="What's on your mind?..." 
              autocomplete="off"
            >
          </div>

          <div class="form-group form-group-select">
            <label for="note-category">Category</label>
            <select id="note-category" name="note-category">
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Study">Study</option>
            </select>
          </div>

          <button type="submit" id="add-note-btn">Add Note</button>
        </form>
        <p id="error-message" class="error-message" role="alert"></p>
      </section>

      <!-- Section 2: Your notes -->
      <section class="card section-your-notes">
        <div class="section-header-row">
          <h2>Your notes</h2>
          <button type="button" id="clear-all-btn" class="clear-all-btn" title="Delete all notes">Clear all</button>
        </div>

        <div class="search-box">
          <label for="search-input" class="visually-hidden">Search notes</label>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search notes..." 
            autocomplete="off"
          >
        </div>

        <p id="note-count">You have no notes yet.</p>

        <ul id="notes-list" class="notes-list"></ul>
      </section>
    </main>

    <footer class="app-footer">
      <p>&copy; 2026 QuickNotes. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
